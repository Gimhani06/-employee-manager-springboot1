<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            padding: 30px;
            color: #263238;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        h1 { color: #263b80; }
        .panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 3px 12px #0000000d;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin: 6px 0;
            border: 1px solid #ccd2df;
            border-radius: 6px;
        }
        button, .action {
            display: inline-block;
            background: #344bb5;
            color: white;
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }
        .delete { background: #c0392b; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e5e8ef;
        }
        th { background: #eef1fb; }
        .message { color: #16804a; }
        .error { color: #c0392b; }
        .actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Employee Manager</h1>
    <p>Manage your employee records.</p>

    <div class="panel">
        <h2>Add Employee</h2>

        <p class="message" th:if="${successMessage}"
           th:text="${successMessage}"></p>
        <p class="error" th:if="${errorMessage}"
           th:text="${errorMessage}"></p>

        <form th:action="@{/save}" th:object="${employee}" method="post">
            <div class="form-grid">
                <div>
                    <input type="text" th:field="*{fullName}" placeholder="Full name" required>
                    <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div>
                    <input type="email" th:field="*{email}" placeholder="Email address" required>
                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div>
                    <input type="tel"
                           th:field="*{phone}"
                           placeholder="Phone number"
                           required
                           pattern="[0-9]{10}"
                           maxlength="10"
                           inputmode="numeric"
                           title="Phone must contain exactly 10 digits">
                    <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div>
                    <input type="text" th:field="*{department}" placeholder="Department" required>
                    <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>
                <div>
                    <input type="number" step="0.01" th:field="*{salary}" placeholder="Salary" required>
                    <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                </div>
            </div>
            <br>
            <button type="submit">Add Employee</button>
        </form>
    </div>

    <div class="panel">
        <h2>Employee List</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>
                <td>
                    <div class="actions">
                        <a class="action" th:href="@{/edit/{id}(id=${emp.id})}">Edit</a>
                        <a class="action delete" th:href="@{/delete/{id}(id=${emp.id})}" onclick="return confirm('Delete this employee?')">
                            Delete
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="7">No employees added yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
